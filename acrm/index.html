<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ART CRM — โปรเจกต์ a</title>
<style>
/* ===== โทเคน ===== */
:root{--n:#1B2F57;--n2:#0A2A66;--bg:#EDF1F8;--card:#fff;--ink:#1B1F2A;--mu:#5B6474;--ln:#D8E0EC;--ln2:#EEF1F6;--soft:#E3E9F5;--red:#A11D1D;--grn:#17603A;--amb:#8A5A00;--r:14px;--fs1:12px;--fs2:13px;--fs3:14px;--fs4:16px;--fs5:18px;--fs6:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:#cfd6e4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:var(--fs3);-webkit-text-size-adjust:100%;touch-action:manipulation}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.ic{width:20px;height:20px;flex:none}
/* ===== โครงหน้า ===== */
.hd{flex:none;background:var(--n);color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 9px}
.hd .row{align-items:center}.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--fs5);letter-spacing:1px}.brand i{width:8px;height:20px;background:#fff;border-radius:3px}
.brand small{font-size:var(--fs1);font-weight:600;letter-spacing:0;background:rgba(255,255,255,.18);border-radius:12px;padding:2px 8px}
.hi{display:flex;gap:2px}.hi a{position:relative;width:40px;height:40px;margin:-6px 0;display:flex;align-items:center;justify-content:center;cursor:pointer}.hi .ic{width:23px;height:23px}
.bdg{position:absolute;top:2px;right:0;background:#d32f2f;color:#fff;border-radius:9px;font-size:var(--fs1);font-weight:700;font-style:normal;padding:0 5px;line-height:16px}
.st{font-size:var(--fs2);opacity:.92;margin-top:2px;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#3ccf86;display:inline-block}.dot.w{background:#f5b942}.dot.x{background:#9aa3b5}.dot.e{background:#ff6b6b}
.bd{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}.bd::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:8px;min-height:36px}.top h1{font-size:var(--fs4);margin:0;flex:1;min-width:0}.top .t{flex:none}
.bk{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px 10px 6px 6px;font-weight:700;color:var(--n);flex:none;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bk .ic{width:18px;height:18px}
.act{position:sticky;bottom:-12px;margin:4px -12px -12px;padding:10px 12px 12px;background:linear-gradient(rgba(237,241,248,0),var(--bg) 22%);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;z-index:3}
.nv{flex:none;position:relative;z-index:5;background:#fff;border-top:1px solid var(--ln);display:flex;align-items:flex-end;padding-bottom:max(4px,env(safe-area-inset-bottom))}
.nv a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs1);color:var(--mu);padding:8px 0 4px;min-height:54px;position:relative;cursor:pointer}.nv a .ic{width:22px;height:22px}
.nv a.on{color:var(--n);font-weight:700}.nv a.on::before{content:'';position:absolute;top:-1px;left:16%;right:16%;height:3px;background:var(--n);border-radius:0 0 3px 3px}
.nv .fab{flex:none;width:74px;color:var(--n);font-weight:700}.nv .fab i{display:flex;width:50px;height:50px;margin:-24px auto 2px;border-radius:50%;background:var(--n);color:#fff;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff,0 3px 10px rgba(27,47,87,.3)}.nv .fab .ic{width:24px;height:24px}
/* ===== การ์ด / ข้อความ ===== */
.c{background:var(--card);border-radius:var(--r);padding:12px 14px;display:block}
.sec{background:var(--card);border-radius:var(--r);padding:0 14px 6px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;font-weight:700;font-size:var(--fs3);border-bottom:1px solid var(--ln)}.sh a,.sh button{font-weight:700;color:var(--n)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;height:40px;padding:0;border-bottom:1px solid var(--ln2);font-size:var(--fs3);cursor:default}.kv.open{height:auto;min-height:40px;padding:6px 0}.kv:last-child{border-bottom:0}.kv>span{color:var(--mu);flex:none;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv>b{text-align:right;font-weight:600;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv.open>b{white-space:normal;overflow:visible}
.t{font-size:var(--fs2);color:var(--mu)}.tl{font-size:var(--fs3);font-weight:700}.big{font-size:var(--fs6);font-weight:800;color:var(--n)}.rd{color:var(--red)}.gn{color:var(--grn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.row>.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lk{color:var(--n);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:8px 2px;margin:-8px 0}.lk .ic{width:16px;height:16px}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:var(--fs1);font-weight:700;white-space:nowrap}
.p-red{background:#FDE2E2;color:var(--red)}.p-amb{background:#FBF0D6;color:var(--amb)}.p-blu{background:var(--soft);color:var(--n)}.p-grn{background:#E3F4EA;color:var(--grn)}.p-gry{background:#ECEEF2;color:var(--mu)}
.note{border-radius:12px;padding:9px 12px;font-size:var(--fs3)}.note.w{background:#FBF0D6;color:var(--amb)}.note.ok{background:#E3F4EA;color:var(--grn)}.note.i{background:var(--soft);color:var(--n)}
.empty{color:var(--mu);font-size:var(--fs3);padding:12px 0;text-align:center}
/* ===== ปุ่ม ===== */
.b{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;padding:10px 12px;border:0;border-radius:12px;background:var(--n);color:#fff;font-weight:700;cursor:pointer;text-align:center}
.b.o{background:#fff;color:var(--n);border:1px solid var(--ln)}.b.d{background:#fff;color:var(--red);border:1px solid #f0c4bf}.b.sm{width:auto;min-height:44px;padding:7px 12px;font-size:var(--fs3)}
.b.off,.b:disabled{opacity:.45;pointer-events:none}.b .ic{width:19px;height:19px}
.tb td:last-child:not(:first-child){width:44px;padding-left:6px}.tb td:first-child{word-break:break-word}.ch .nm{font-size:var(--fs5);font-weight:700;line-height:1.35;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ha{display:flex;border-top:1px solid var(--ln);margin-top:10px}.ha a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 2px;color:var(--n);font-size:10.5px;font-weight:700;text-align:center;line-height:1.2}.ha a+a{border-left:1px solid var(--ln)}.ha .ic{width:22px;height:22px}.ha a.off{opacity:.35}
.ha.dk{border-top-color:rgba(255,255,255,.25)}.ha.dk a{color:#fff}.ha.dk a+a{border-left-color:rgba(255,255,255,.25)}
.ha.rd{border:0;gap:8px}.ha.rd a{justify-content:center;background:var(--soft);border-radius:12px;padding:8px 2px}.ha.rd a+a{border:0}
.hb{background:var(--n);color:#fff}.hb .t{color:rgba(255,255,255,.75)}.hb .lk{color:#fff}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--soft);color:var(--n);font-weight:700;font-size:var(--fs5);display:flex;align-items:center;justify-content:center}
.vs{margin:8px 0 0}.vs .seg a{padding:6px 2px;font-size:var(--fs2)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kg3{grid-template-columns:repeat(3,1fr)}
.kp{background:var(--card);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}.kp span{font-size:var(--fs1);color:var(--mu)}.kp b{font-size:var(--fs3);color:var(--n);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kp em{font-style:normal;font-size:var(--fs1);color:var(--mu)}
.cb{height:8px;border-radius:6px;background:var(--ln2);overflow:hidden;margin:10px 0 6px}.cb i{display:block;height:100%;border-radius:6px}
.mb{display:flex;align-items:flex-end;gap:6px;padding:10px 0 6px}.mb>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}.mb i{display:block;width:100%;max-width:26px;background:var(--n);border-radius:5px 5px 0 0;opacity:.85}.mb span{font-size:var(--fs1);color:var(--mu)}.mb em{font-style:normal;font-size:10px;color:var(--mu)}
.pb{height:6px;border-radius:4px;background:var(--ln2);margin-top:4px}.pb i{display:block;height:100%;background:var(--n);border-radius:4px}
.fd{background:var(--card);border-radius:var(--r);margin:10px 0;padding:0 12px}.fd>summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--n);cursor:pointer;list-style:none}.fd>summary::-webkit-details-marker{display:none}.fd>summary:after{content:'▾';margin-left:auto;color:var(--mu)}.fd[open]>summary:after{content:'▴'}.fd .sec{padding:0}.fd .sh{border-top:1px solid var(--ln)}
.lk.ico{padding:8px 10px;margin:-8px -6px;min-height:40px}.pl{width:34px;height:34px;flex:none;border-radius:12px;border:0;background:none;color:var(--n);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
/* ===== ตัวเลือก / แท็บ / KPI ===== */
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:#fff;border-radius:12px;padding:8px 13px;min-height:44px;font-size:var(--fs3);font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}.chip.on{background:var(--n);border-color:var(--n);color:#fff}
.seg{display:flex;background:#fff;border-radius:12px;padding:3px;gap:2px}.seg a{flex:1;text-align:center;padding:9px 2px;border-radius:12px;font-size:var(--fs3);font-weight:700;color:var(--mu);cursor:pointer}.seg a.on{background:var(--n);color:#fff}
.kp{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px 2px;min-height:48px;text-align:center;font-size:var(--fs2);color:var(--mu);cursor:pointer}.kp b{display:block;font-size:var(--fs5);color:var(--n);line-height:1.25}.kp.on{background:var(--n);border-color:var(--n);color:#fff}.kp.on b{color:#fff}
/* ===== ฟอร์ม ===== */
input,select,textarea{width:100%;min-height:46px;font-size:var(--fs4);border:1px solid var(--ln);border-radius:12px;padding:8px 11px;background:#fff}textarea{min-height:76px;resize:vertical}
label.l{display:block;font-size:var(--fs2);color:var(--mu);margin:8px 0 3px}.er{color:#A11D1D;font-size:var(--fs2);margin-top:3px}.er:empty{display:none}
.xw{position:relative;display:block}.xi{padding-right:36px!important}.xc{position:absolute;right:6px;top:50%;margin-top:-13px;width:32px;height:32px;margin-top:-16px;border:0;background:none;color:#8a94a6;line-height:1;display:none;align-items:center;justify-content:center;padding:0;cursor:pointer}.xc.xt{top:6px;margin-top:0}.xc svg{width:14px;height:14px;display:block}
.sr{position:relative}.sr .ic{position:absolute;left:12px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--mu);pointer-events:none;z-index:2}.sr input{padding-left:38px}
/* ===== ตาราง / รายการ ===== */
.tb{width:100%;border-collapse:collapse;font-size:var(--fs3)}.tb th{color:var(--mu);font-weight:500;text-align:left;padding:7px 4px 5px;border-bottom:1px solid var(--ln)}.tb td{padding:6px 4px;border-bottom:1px solid var(--ln2);vertical-align:middle}.tb tr:last-child td{border-bottom:0}.tb .r{text-align:right;white-space:nowrap}.tb td .t{font-size:var(--fs1)}
.grow>b,.grow>.t{display:block}
.li{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-bottom:1px solid var(--ln2);cursor:pointer}.li:last-child{border-bottom:0}.li .grow{flex:1;min-width:0}.li b{display:block;overflow:hidden;text-overflow:ellipsis}
.cr{background:#fff;border-radius:var(--r);border-left:4px solid #8a94a6;padding:9px 12px;cursor:pointer}.cr:active{background:#f4f6fa}
.cr .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;border-radius:12px;background:#fff;border:1px solid var(--ln);font-size:var(--fs2);font-weight:700;color:var(--n);cursor:pointer}.ab .ic{width:22px;height:22px}.ab.p{background:var(--n);color:#fff;border-color:var(--n)}
/* ===== การ์ดเอกสาร (บิล/ออเดอร์) ===== */
.dc{background:#fff;border-radius:var(--r);padding:0 12px}.dh{display:flex;justify-content:space-between;gap:8px;min-height:40px;align-items:center;border-bottom:1px solid var(--ln);font-weight:700;font-size:var(--fs3);cursor:pointer}.dh b{white-space:nowrap}.ds{font-size:var(--fs3);font-weight:600;padding:7px 0 0}
.ba{display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:42px;border-top:1px solid var(--ln2)}.ba>span{display:flex}.ba a{display:inline-flex;align-items:center;gap:3px;padding:10px 6px;font-size:var(--fs2);font-weight:700;color:var(--n);cursor:pointer}.ba .ic{width:15px;height:15px}
/* ===== รูป ===== */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.ph div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#dde3ee}.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}.ph button{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:var(--fs5)}
.cap{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px;border:2px dashed #b9c6dc;border-radius:12px;background:#f7f9fd;color:var(--n);font-weight:800;cursor:pointer;width:100%;text-align:left}.cap .ic{width:30px;height:30px}.cap small{display:block;font-weight:500;color:var(--mu);font-size:var(--fs2)}
/* ===== เอกสาร ===== */
.slip{container-type:inline-size;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:3.6cqw;font-size:2.7cqw;color:#111}.slip b{color:#1a2b4c}
.slh{display:flex;justify-content:space-between;align-items:flex-start;gap:3cqw}.slk{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw 3cqw;align-items:baseline}.slk span{color:#6b7a90}.slk b{font-size:3.1cqw}
.sln{background:#f0f3f9;border:1px solid var(--ln);border-radius:2.4cqw;padding:1.6cqw 2.4cqw;text-align:right;white-space:nowrap}.sln span{color:#6b7a90;margin-right:2cqw}
.slt{width:100%;border-collapse:collapse;margin:3cqw 0}.slt th{background:#1a2f58;color:#fff;padding:1.8cqw 1.6cqw;font-size:2.5cqw}.slt td{border:1px solid #dfe4ee;padding:0 1.6cqw;height:6cqw;font-size:2.5cqw}
.slf{display:flex;justify-content:space-between;gap:3cqw;font-size:2.6cqw;line-height:1.9}.slf>div:last-child{min-width:44%}.slf p{display:flex;justify-content:space-between;margin:0;color:#6b7a90}.slf p.tt{border-top:1px solid #dfe4ee;margin-top:1cqw;padding-top:1cqw;border-bottom:.6cqw solid #1a2b4c;font-size:3.1cqw}
.sheetbox{background:#fff;border:1px solid var(--ln);border-radius:8px;overflow:hidden;cursor:pointer}.sheet{container-type:inline-size;position:relative}.sheet img{display:block;width:100%}
.sf{font-family:Sarabun,"Noto Sans Thai",sans-serif;position:absolute;color:#111;line-height:1;transform:translateY(-50%);white-space:nowrap;font-size:1.838cqw}
.pre{white-space:pre-wrap;background:#fff;border-radius:var(--r);padding:12px;font-size:var(--fs3);line-height:1.6}
/* ===== ป๊อปอัป ===== */
.mod{position:absolute;inset:0;z-index:20;background:rgba(15,22,38,.5);display:flex;align-items:flex-end}.mod>div{background:#fff;width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px max(14px,env(safe-area-inset-bottom))}
.mod.full{align-items:flex-start;background:#fff;overflow:auto}.mod.full>div{border-radius:0;padding:0;width:900px;max-width:none;max-height:none}
#toast{position:absolute;left:12px;right:12px;bottom:86px;z-index:30;background:#1f2533;color:#fff;border-radius:12px;padding:12px 14px;font-size:var(--fs3);display:none}
.ctw{padding:0}.ctl{font-size:var(--fs2);font-weight:600;color:var(--navy,#1f2e5a);background:#eaeef7;padding:5px 14px}.ctr{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line,#e3e8f3)}.ctr>a.row{flex:1;min-width:0;align-items:center;gap:10px}.ctr .grow{min-width:0}.ctr .nm,.ctr .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nb{background:#f3f5fa;border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}.nb .t{display:block}.cav{width:40px;height:40px;border-radius:50%;background:#dbe4f7;color:#1f2e5a;display:flex;align-items:center;justify-content:center;font-size:var(--fs3);font-weight:600;flex:none}.cl{width:44px;height:44px;border-radius:50%;background:#1f2e5a;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.cl.off{background:#d5dbe8}.cl .ic{width:20px;height:20px}
/* ===== เทมเพลตตัวอักษรเดียวทั้งระบบ =====
   ฟอนต์ Noto Sans Thai · ตัวปกติ 400 = ข้อความ/ป้ายรอง · กึ่งหนา 600 = ค่า/ปุ่ม/ป้าย · หนา 700 = หัวข้อ/ชื่อ/ตัวเลขสรุป */
html,body,button,input,select,textarea{font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important;font-weight:400!important;line-height:1.45!important;letter-spacing:0!important}
body{font-size:var(--fs3)!important;color:var(--ink)!important}
.t,small,.lbl,.meta{font-size:var(--fs1)!important;font-weight:400!important;color:var(--mu)!important}
.tl,.sh,.top h1,.ch .nm,.hd h1,.brand,.st b,.bdg,.bk,.av{font-weight:700!important}
.sh{font-size:var(--fs3)!important;color:var(--n)!important;min-height:34px!important}
.top h1{font-size:var(--fs4)!important;color:var(--n)!important}
.ch .nm{font-size:var(--fs5)!important;color:var(--n)!important}
.kv>span{font-size:var(--fs3)!important;font-weight:400!important;color:var(--mu)!important}
.kv>b,.tb td,.row b,.dh b,.ba a{font-size:var(--fs3)!important;font-weight:600!important;color:var(--ink)!important}
.big,.kp b,.kpi b{font-size:var(--fs6)!important;font-weight:700!important;color:var(--n)!important}
.pill,.lk,.b,.chip,.seg a,.ha a,.nv a{font-weight:600!important}
.pill{font-size:var(--fs1)!important}
.ha a{font-size:var(--fs1)!important;color:var(--n)!important}
.b{font-size:var(--fs3)!important}
input,select,textarea{font-size:var(--fs3)!important}

/* ตัดสินใจ: แถบน้ำเงินมีเงาและตัวอักษรขาว/อ่านชัด */
.hd{box-shadow:0 3px 12px rgba(12,24,52,.35);position:relative;z-index:2}
.hd small,.brand small{color:#fff!important;background:rgba(255,255,255,.22)!important}
.hd .st,.hd .st span,.hd .st b{color:#fff!important;opacity:.95}
.hd .t{color:#d7e0f2!important}
.nvc{background:var(--n)!important;box-shadow:0 6px 18px rgba(12,24,52,.30)!important;border:0!important}
.nvc,.nvc b,.nvc span{color:#fff!important}
.nvc .t{color:#c9d4ea!important}
.nvc b{font-weight:700!important}

var MTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function p2(n){return ('0'+n).slice(-2)}
function now(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())}
var TD=now().slice(0,10);
function addDays(ymd,n){var d=new Date(ymd+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b.slice(0,10))-new Date(a.slice(0,10)))/864e5)}
function since(ymd){return daysBetween(ymd,TD)}
function dt(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+String(+s.slice(0,4)+543).slice(-2):'—'}       // 09/02/69 ใช้ทุกหน้าจอ
function dtFull(s){return s.slice(8,10)+'/'+s.slice(5,7)+'/'+(+s.slice(0,4)+543)}                           // 09/02/2569 ใช้ในเอกสาร
function hm(s){return s.length>10?s.slice(11,16):''}
function ymOf(back){var d=new Date(+TD.slice(0,4),+TD.slice(5,7)-1-back,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function ymLabel(ym){return MTH[+ym.slice(5,7)-1]+' '+(+ym.slice(0,4)+543)}
function fm(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function money(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function digits(s){return String(s||'').replace(/\D/g,'')}
// จัดรูปแบบเบอร์ไทยเพื่อแสดงผล: 02-XXX-XXXX · 0XX-XXX-XXX (บ้านต่างจังหวัด) · 0XX-XXX-XXXX (มือถือ) · อื่น ๆ คงเดิม
function fmtTel(s){var d=digits(s),t=String(s||'').trim();if(d.charAt(0)!=='0')return t;if(d.length===9)return d.slice(0,2)==='02'?d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5):d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return t}
function by(k,desc){return function(a,b){var x=a[k],y=b[k];return (x<y?-1:x>y?1:0)*(desc?-1:1)}}
function one(list,k,v){for(var i=0;i<list.length;i++)if(list[i][k]===v)return list[i];return null}

var KEY='artcrm.v2',BKEY='artcrm.v2.backup',DB,MEM={};
var Store={db:null,
 open:function(){var s=this;return new Promise(function(ok){try{var r=indexedDB.open('artcrm',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){s.db=r.result;ok()};r.onerror=function(){ok()}}catch(e){ok()}})},

 for(;i<n;i++){c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}
