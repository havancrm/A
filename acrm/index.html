<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3159">
<title>aCRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f8;--card:#fff;--line:#e4e8f0;--ink:#1b2333;--mute:#6f7a8e;--navy:#1d3159;--navy2:#2b4a80;--blue:#eaf0fb;--green:#e5f5ec;--greenink:#1d7a3c;--amber:#fff3dc;--amberink:#8a5a00;--shadow:0 1px 2px rgba(20,30,55,.04),0 4px 14px rgba(20,30,55,.05)}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Noto Sans Thai",-apple-system,sans-serif;padding:0 0 110px}
[hidden]{display:none!important}
.wrap{max-width:440px;margin:0 auto;padding:0 14px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px}
.bar b{font-size:16px}
.sync{font-size:12px;color:var(--mute)}
.back{border:0;background:none;color:var(--navy);font-weight:700;font-size:14px;padding:8px 2px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font-size:14px;box-shadow:var(--shadow);margin-bottom:6px;color:var(--ink)}
.count{font-size:12px;color:var(--mute);margin:4px 2px 8px}
.crow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:0;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--ink)}
.cn{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{font-size:12px;color:var(--mute);margin-top:2px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;background:var(--blue);color:var(--navy);white-space:nowrap}
.pill.g{background:var(--green);color:var(--greenink)}
.pill.a{background:var(--amber);color:var(--amberink)}
.tagp{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;background:var(--blue);color:var(--navy)}
.empty{text-align:center;color:var(--mute);padding:24px 0;font-size:13px}
/* hero */
.hero{background:linear-gradient(160deg,#1d3159 0%,#243f70 100%);color:#fff;border-radius:18px;padding:14px;box-shadow:0 10px 24px rgba(29,49,89,.22);position:relative;margin-top:6px}
.hname{font-size:17px;font-weight:700;line-height:1.25;padding-right:64px;overflow-wrap:anywhere}
.htype{font-size:12px;opacity:.8;margin-top:3px}
.hicon{position:absolute;top:12px;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.hb{background:#fff;color:var(--navy);border:0;border-radius:10px;min-height:38px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer}
.hb svg{flex:none}
.stats{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;min-height:62px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat .k{font-size:12px;color:var(--mute)}
.stat .meta{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.35}
.tabs{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto}
.tab{flex:none;border:0;background:var(--card);color:var(--mute);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:600;box-shadow:var(--shadow);cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(29,49,89,.25)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 14px;margin-top:10px}
.ctitle{font-size:15px;font-weight:700;padding:10px 0 6px}
.r{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.r:first-of-type{border-top:0}
.r .k{font-size:13px;color:var(--mute)}
.r .v{font-weight:600;overflow-wrap:anywhere}
.lnk{color:var(--navy);font-weight:600;text-decoration:none}
.ghost{width:100%;border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:12px;padding:10px;font-size:13px;font-weight:600;margin-top:10px;cursor:pointer}
.bl{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.bl-h{background:#e4ebf7;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.bl-h b{font-weight:700}.bl-h span{color:var(--mute);font-size:13px;margin-left:4px}
.bl-r{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13px}
.bn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp{color:var(--mute);white-space:nowrap}
.ba{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bl-f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.bl-acts a{color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;margin-right:12px;display:inline-flex;align-items:center;gap:4px}
.bl-tot{font-size:15px;font-weight:800;color:var(--navy);white-space:nowrap}
.bl-tot small{color:var(--mute);font-weight:500;font-size:12px;margin-right:4px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pr:first-of-type{border-top:0}
.pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{flex:none;font-weight:600;color:var(--navy);font-size:13px}
.due{background:var(--amber);border-radius:14px;padding:12px;margin-top:10px}
.due .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(0,0,0,.06)}
.due .it:first-of-type{border-top:0}
.due .t{font-weight:700;color:var(--amberink);font-size:13px}
.due .m{font-size:12px;color:var(--amberink);opacity:.85}
.done{font-size:12px;font-weight:600;border:1px solid var(--amberink);background:transparent;color:var(--amberink);border-radius:8px;padding:4px 8px;cursor:pointer}
.types{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
textarea,input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
textarea{min-height:68px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin:8px 0 2px}
.chk input{width:auto}
.btns,.btnrow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-weight:600;font-size:14px;text-align:center;text-decoration:none;cursor:pointer;display:block}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl{position:relative;padding-left:16px;margin-top:6px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 14px 10px}
.ev:before{content:"";position:absolute;left:-14px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 3px var(--card)}
.ev .h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ev .h b{font-weight:700}
.ev .d{font-size:12px;color:var(--mute)}
.ev .x{font-size:13px;margin-top:3px;white-space:pre-wrap}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--blue);color:var(--navy);margin-right:4px}
.tag.g{background:var(--green);color:var(--greenink)}
/* bottom nav + sheet */
.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:var(--card);box-shadow:0 -6px 20px rgba(20,30,55,.06);display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 4px env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 0;cursor:pointer}
.nav button.on{color:var(--navy);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(10,16,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sbox{background:var(--card);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sbox h3{margin:0 0 10px;font-size:15px}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.fg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90%;text-align:center}
.toast.on{opacity:1}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.mhead b{font-size:16px}
.chipbtn{border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:10px;padding:6px 12px;font-size:16px;font-weight:700;cursor:pointer}
.bar6{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.bar6 .mo{color:var(--mute)}
.bar6 .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar6 .track i{display:block;height:100%;background:var(--navy)}
.bar6 b{text-align:right;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.subh{padding-top:6px}
.field{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{font-size:12px;color:var(--mute)}
.field input{margin-top:4px}
.err{color:#b42318;font-size:13px;margin-top:6px}
.yrs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.yrs .chipbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">

  <!-- รายชื่อลูกค้า -->
  <section id="v-list">
    <div class="bar"><b>ลูกค้า</b><span class="sync" id="sync"></span></div>
    <input class="search" id="q" placeholder="ค้นหาชื่อ / รหัส / เบอร์" autocomplete="off">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <!-- รายละเอียดลูกค้า -->
  <section id="v-detail" hidden>
    <div style="padding-top:6px"><button class="back" onclick="goList()">‹ กลับรายชื่อลูกค้า</button></div>
    <section class="hero" id="hero"></section>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="info" onclick="setTab('info')">ข้อมูล</button>
      <button class="tab" role="tab" data-t="prod" onclick="setTab('prod')">สินค้า</button>
      <button class="tab" role="tab" data-t="act" onclick="setTab('act')">กิจกรรม</button>
    </div>
    <div class="panel" id="p-info"></div>
    <div class="panel" id="p-prod"></div>
    <div class="panel" id="p-act"></div>
  </section>

  <!-- ตั้งค่า -->
  <section id="v-settings" hidden>
    <div class="bar"><b>ตั้งค่า</b></div>
    <div class="card">
      <div class="ctitle">เชื่อมชีต A</div>
      <label class="fld"><span>URL ของ Apps Script (ลงท้าย /exec)</span><input id="s_api" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label class="fld"><span>API_TOKEN (เฉพาะกรณีตั้งไว้ใน Code.gs)</span><input id="s_token" placeholder="เว้นว่างถ้าไม่ได้ตั้ง"></label>
      <div class="btnrow"><button class="btn" onclick="testApi()">ทดสอบการเชื่อม</button><button class="btn pri" onclick="saveApi()">บันทึก</button></div>
      <div class="count" id="s_msg" style="margin-bottom:12px"></div>
    </div>
  </section>
</div>

<nav class="nav">
  <button data-v="list" onclick="goList()"><span id="ic-users"></span>ลูกค้า</button>
  <button data-v="back" onclick="openBack()"><span id="ic-gear"></span>หลังบ้าน</button>
</nav>

<section id="v-back" hidden>
  <div class="bar"><b>หลังบ้าน</b></div>
  <div class="menu">
    <button class="crow" onclick="openMonth()"><div style="min-width:0"><div class="cn">รายงานรายเดือน</div><div class="cm">ยอดขาย · ร้านที่ซื้อ · ร้านที่ยอดลดลง</div></div></button>
    <button class="crow" onclick="openSales()"><div style="min-width:0"><div class="cn">ยอดขาย</div><div class="cm">ยอดรายเดือนของแต่ละปี</div></div></button>
    <button class="crow" onclick="openBills()"><div style="min-width:0"><div class="cn">บิลขาย</div><div class="cm">ค้นหาบิลตามเลขบิลหรือชื่อร้าน</div></div></button>
    <button class="crow" onclick="openProducts()"><div style="min-width:0"><div class="cn">สินค้า</div><div class="cm">รายการสินค้าทั้งหมด ค้นหาได้</div></div></button>
    <button class="crow" onclick="openContacts()"><div style="min-width:0"><div class="cn">สมุดโทร</div><div class="cm">รายชื่อร้านเรียงตามตัวอักษร โทรได้ทันที</div></div></button>
    <button class="crow" onclick="openX('orders')"><div style="min-width:0"><div class="cn">ออเดอร์</div><div class="cm">รายการออเดอร์ รอส่ง ส่งแล้ว ยกเลิก</div></div></button>
    <button class="crow" onclick="openPick('cart')"><div style="min-width:0"><div class="cn">รับออเดอร์</div><div class="cm">เลือกร้าน เลือกสินค้าจากราคาล่าสุด</div></div></button>
    <button class="crow" onclick="openX('map')"><div style="min-width:0"><div class="cn">แผนที่ร้าน</div><div class="cm">ร้านที่มีพิกัด เลือกเส้นทางเปิดใน Google Maps</div></div></button>
    <button class="crow" onclick="openPick('visit')"><div style="min-width:0"><div class="cn">เข้าพบ</div><div class="cm">ถ่ายรูปร้านและบันทึกพิกัด</div></div></button>
    <button class="crow" onclick="openSub('hub')"><div style="min-width:0"><div class="cn">ระบบและกติกา</div><div class="cm">กติกาตัวเลข ตัวเลือก ซิงก์ สำรอง ประวัติ ตรวจข้อมูล</div></div></button>
    <button class="crow" onclick="openSettings()"><div style="min-width:0"><div class="cn">ตั้งค่า</div><div class="cm">เชื่อมชีต A</div></div></button>
  </div>
</section>
<section id="v-month" hidden>
  <div style="padding-top:6px"><button class="back" onclick="openBack()">‹ หลังบ้าน</button></div>
  <div class="mhead"><button class="chipbtn" id="mPrev" aria-label="เดือนก่อน">‹</button><b id="mTitle"></b><button class="chipbtn" id="mNext" aria-label="เดือนถัดไป">›</button></div>
  <div id="mBody"></div>
</section>
<section id="v-sales" hidden>
  <div style="padding-top:6px"><button class="back" onclick="openBack()">‹ หลังบ้าน</button></div>
  <div class="yrs" id="yrs"></div>
  <div id="salesBody"></div>
</section>
<section id="v-bills" hidden>
  <div style="padding-top:6px"><button class="back" onclick="openBack()">‹ หลังบ้าน</button></div>
  <input class="search" id="bq" placeholder="ค้นหาเลขบิล หรือชื่อร้าน" autocomplete="off">
  <div class="count" id="bcount"></div>
  <div id="blist"></div>
</section>
<section id="v-products" hidden>
  <div style="padding-top:6px"><button class="back" onclick="openBack()">‹ หลังบ้าน</button></div>
  <input class="search" id="pq" placeholder="ค้นหารหัสหรือชื่อสินค้า" autocomplete="off">
  <div class="count" id="pcount"></div>
  <div id="plist"></div>
</section>
<section id="v-sub" hidden>
  <div id="subBody"></div>
</section>
<section id="v-x" hidden>
  <div id="xBody"></div>
</section>
<section id="v-contacts" hidden>
  <div style="padding-top:6px"><button class="back" onclick="openBack()">‹ หลังบ้าน</button></div>
  <input class="search" id="cq" placeholder="ค้นหาชื่อร้าน · เบอร์ · ผู้ติดต่อ" autocomplete="off">
  <div class="count" id="ccount"></div>
  <div id="clist"></div>
</section>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sbox"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- ตัวช่วย ---------- */
var $=function(s){return document.querySelector(s)};
var I={
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',

 cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.9a1.5 1.5 0 0 0 1.5-1.1L21 7H6"/>',

 send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',

 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
function ic(k,s){s=s||16;return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[k]+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){var x=Number(n);return (n===''||n==null||isNaN(x))?'-':x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fd(x){if(!x)return '-';var d=new Date(x);return isNaN(d)?String(x):d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}
function ts(x){var d=new Date(x);return isNaN(d)?0:d.getTime()}
function pd(a){try{return JSON.parse(a.data||'{}')}catch(e){return {}}}
function col(n){var s='';while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},1800)}
function setSync(m){$('#sync').textContent=m}

/* ---------- สถานะ + เรียก Apps Script ---------- */
var DB={orders:[],oitems:[],cart:null,xv:'orders',xa:null,xf:'all',xq:'',xsel:[],xphotos:[],sets:[],loadedAt:null,sub:'hub',prod:[],api:localStorage.getItem('acrm.api')||'',token:localStorage.getItem('acrm.token')||'',cust:[],custH:[],acts:[],bills:[],items:[],cur:null,tab:'info',type:'โทร',pin:false,draft:''};
var TYPES=['โทร','เยี่ยม','ส่งของ','โน้ต','นัดติดตาม'];

function call(body){
  if(DB.token)body.token=DB.token;
  return fetch(DB.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.json()})
    .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||'เชื่อมต่อไม่ได้');return j});
}
// แปลงค่าที่อ่านจากชีตเป็นอ็อบเจกต์ตามหัวคอลัมน์ พร้อมเก็บเลขแถวและค่าดิบไว้เขียนกลับ
function toObjs(v){
  if(!v||!v.length)return {H:[],rows:[]};
  var H=v[0];
  return {H:H,rows:v.slice(1).map(function(r,i){
    var raw=H.map(function(_,j){return r[j]==null?'':String(r[j])});
    var o={_row:i+2,_raw:raw};
    H.forEach(function(h,j){o[h]=raw[j]});
    return o;
  })};
}
function pull(){
  if(!DB.api)return Promise.reject(new Error('ยังไม่ได้ตั้งค่า URL'));
  setSync('กำลังโหลด…');
  return Promise.all([
    call({action:'get',range:'customers!A1:AL'}),
    call({action:'get',range:'activities!A1:K'}),
    call({action:'get',range:'bills!A1:M'}),
    call({action:'get',range:'bill_items!A1:G'}),
    call({action:'get',range:'products!A1:B'}),
    call({action:'get',range:'systemSettings!A1:C'}),
    call({action:'get',range:'orders!A1:P'}),
    call({action:'get',range:'order_items!A1:H'})
  ]).then(function(a){
    DB.orders=toObjs(a[6].values).rows;
    DB.oitems=toObjs(a[7].values).rows;
    DB.prod=toObjs(a[4].values).rows;
    DB.sets=toObjs(a[5].values).rows;
    DB.loadedAt=new Date();
    var c=toObjs(a[0].values);DB.custH=c.H;DB.cust=c.rows.filter(function(x){return x.id});
    DB.acts=toObjs(a[1].values).rows;
    DB.bills=toObjs(a[2].values).rows;
    DB.items=toObjs(a[3].values).rows;
    DB._br=null;
    setSync('ซิงก์แล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));
  }).catch(function(e){setSync('เชื่อมชีตไม่ได้');throw e});
}

/* ---------- ข้อมูลที่คำนวณจากชีต ---------- */
function cust(id){for(var i=0;i<DB.cust.length;i++)if(DB.cust[i].id===id)return DB.cust[i];return null}
function billsOf(cid){
  var m={},out=[];
  DB.bills.forEach(function(b){if(b.customerId===cid&&!m[b.no]){m[b.no]={no:b.no,date:b.date,items:[]};out.push(m[b.no])}});
  DB.items.forEach(function(it){if(m[it.billNo])m[it.billNo].items.push(it)});
  out.forEach(function(b){b.total=b.items.reduce(function(s,it){return s+(Number(it.amount)||0)},0)});
  return out.sort(function(a,b){return ts(b.date)-ts(a.date)});
}
function metrics(c){
  var bl=billsOf(c.id),last=bl[0]?bl[0].date:'';
  var cyc=Number(c.visitCycleDays)||30;
  var next=last?ts(last)+cyc*864e5:0;
  var vis=DB.acts.filter(function(a){return a.customerId===c.id&&a.type==='เยี่ยม'}).sort(function(a,b){return ts(b.at)-ts(a.at)});
  return {bl:bl,last:last,next:next,due:!!next&&Date.now()>=next,visits:vis};
}

/* ---------- รายชื่อ ---------- */
function renderList(){
  var q=$('#q').value.trim().toLowerCase();
  var rows=DB.cust.filter(function(c){
    if(!q)return true;
    return (c.id+' '+c.name+' '+c.phone+' '+c.contactName+' '+c.aliases+' '+c.area).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'th')});
  var shown=rows.slice(0,150);
  $('#count').textContent=rows.length+' ราย'+(rows.length>shown.length?' · แสดง 150 รายการแรก พิมพ์ค้นหาเพิ่ม':'');
  $('#list').innerHTML=shown.map(function(c){
    var last=billsOf(c.id)[0];
    return '<button class="crow" onclick="openCust(\''+esc(c.id)+'\')"><div style="min-width:0"><div class="cn">'+esc(c.name||'-')+'</div><div class="cm">'+esc(c.id)+' · '+esc(c.type||'-')+(c.area?' · '+esc(c.area):'')+'</div></div><span class="pill'+(last?'':' a')+'">'+(last?'ซื้อ '+fd(last.date):'ยังไม่เคยซื้อ')+'</span></button>';
  }).join('')||'<div class="empty">ไม่พบลูกค้า</div>';
}

/* ---------- รายละเอียดลูกค้า ---------- */
function show(v){
  ['list','detail','settings','back','month','contacts','sales','bills','products','sub','x'].forEach(function(x){$('#v-'+x).hidden=(x!==v)});
  var tab={detail:'list',settings:'back',month:'back',contacts:'back',sales:'back',bills:'back',products:'back',sub:'back',x:'back'}[v]||v;
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===tab)});
  window.scrollTo(0,0);
}
function goList(){show('list');renderList()}
function openCust(id){DB.cur=id;DB.tab='info';DB.type='โทร';DB.pin=false;DB.draft='';show('detail');renderDetail()}
function setTab(t){
  DB.tab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t?'true':'false')});
  ['info','prod','act'].forEach(function(p){$('#p-'+p).classList.toggle('on',p===t)});
}
function renderDetail(){
  var c=cust(DB.cur);if(!c){goList();return}
  var m=metrics(c);
  var nav=(c.gpsLat&&c.gpsLng)?c.gpsLat+','+c.gpsLng:(c.address||c.name||'');
  $('#hero').innerHTML=
    '<button class="hicon" style="right:52px" onclick="shareCust()" aria-label="แชร์">'+ic('share')+'</button>'+
    '<button class="hicon" style="right:12px" onclick="openSheet(\'edit\')" aria-label="แก้ไข">'+ic('edit')+'</button>'+
    '<div style="font-size:13px;opacity:.75">'+esc(c.id)+'</div>'+
    '<div class="hname">'+esc(c.name||'-')+'</div>'+
    '<div class="htype">ประเภท : '+esc(c.type||'-')+'</div>'+
    '<div class="hbtns">'+
      '<button class="hb" onclick="openSheet(\'call\')">'+ic('phone')+'โทร</button>'+
      '<a class="hb" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(nav)+'">'+ic('pin')+'นำทาง</a>'+
      '<button class="hb" onclick="toast(\'ยังไม่เปิดรับออเดอร์ในเวอร์ชันนี้\')">'+ic('cart')+'รับออเดอร์</button>'+
    '</div>';

  var stCls=!m.last?'a':(m.due?'a':'g');
  var stTxt=!m.last?'ยังไม่เคยซื้อ':(m.due?'ถึงรอบ':'ยังไม่ถึงรอบ');
  $('#stats').innerHTML=
    '<div class="stat"><span class="k">เข้าพบ</span><span><span class="pill'+(m.visits.length?'':' a')+'">'+(m.visits.length?'เยี่ยม '+m.visits.length+' ครั้ง':'ยังไม่มี')+'</span></span><div class="meta">'+(m.visits.length?'ล่าสุด '+fd(m.visits[0].at):'ยังไม่มีการเข้าพบ')+'</div></div>'+
    '<div class="stat"><span class="k">การซื้อ</span><span><span class="pill '+stCls+'">'+stTxt+'</span></span><div class="meta">'+(m.last?'ซื้อล่าสุด '+fd(m.last)+' · รอบถัดไป '+fd(m.next):'ยังไม่มีบิล')+'</div></div>';

  // ข้อมูลร้าน
  var rows=[
    ['ติดต่อ',esc(c.contactName)],
    ['เบอร์',c.phone?'<a class="lnk" href="tel:'+esc(c.phone.replace(/[^0-9+]/g,''))+'">'+esc(c.phone)+'</a>':''],
    ['ที่อยู่ส่งสินค้า',esc(c.address)],
    ['เงื่อนไขชำระ',esc(c.paymentTerm)],
    ['ป้ายกำกับ',[c.type,c.area].filter(Boolean).map(function(t){return '<span class="tagp">'+esc(t)+'</span>'}).join(' ')],
    ['หมายเหตุ',esc(c.customerNote||c.keepNote)],
    ['ใบกำกับภาษี',esc(c.taxInvoiceRequired)],
    ['ใบเสร็จรับเงิน',esc(c.receiptRequired)]
  ];
  var lastBill=m.bl[0];
  $('#p-info').innerHTML=
    '<div class="card"><div class="ctitle">ข้อมูลร้าน</div>'+rows.map(function(r){return '<div class="r"><span class="k">'+r[0]+'</span><span class="v">'+(r[1]||'-')+'</span></div>'}).join('')+'</div>'+
    (lastBill?billCard(lastBill):'<div class="empty">ยังไม่มีบิล</div>')+
    (m.bl.length?'<button class="ghost" onclick="openSheet(\'hist\')">ดูประวัติทั้งหมด ('+m.bl.length+' บิล) ›</button>':'');

  // สินค้าที่เคยสั่ง
  var agg={},order=[];
  m.bl.forEach(function(b){
    var seen={};
    b.items.forEach(function(it){
      var k=it.name;
      if(!agg[k]){agg[k]={name:k,n:0,price:it.price};order.push(k)}
      if(!seen[k]){seen[k]=1;agg[k].n++}
    });
  });
  order.sort(function(a,b){return agg[b].n-agg[a].n});
  $('#p-prod').innerHTML=order.length?'<div class="card"><div class="ctitle">สินค้าที่เคยสั่ง</div>'+order.map(function(k){return '<div class="pr"><span class="pn">'+esc(k)+'</span><span class="pc">เคยสั่ง '+agg[k].n+' บิล</span></div>'}).join('')+'</div>':'<div class="empty">ยังไม่มีสินค้าที่เคยสั่ง</div>';

  renderAct();
  setTab(DB.tab);
}
function billCard(b){
  return '<div class="bl"><div class="bl-h"><span><b>'+esc(b.no)+'</b><span>· '+fd(b.date)+'</span></span></div>'+
    b.items.map(function(it){return '<div class="bl-r"><span class="bn">'+esc(it.name)+'</span><span class="bp">'+esc(it.qty)+' × '+fm(it.price)+'</span><span class="ba">'+fm(it.amount)+'</span></div>'}).join('')+
    '<div class="bl-f"><span class="bl-acts"><a onclick="copyBill(\''+esc(b.no)+'\')">'+ic('send',14)+'แจ้งยอด</a></span><span class="bl-tot"><small>รวม</small>'+fm(b.total)+'</span></div></div>';
}

/* ---------- กิจกรรม ---------- */
function renderAct(){
  var c=cust(DB.cur);if(!c)return;
  var due=DB.acts.filter(function(a){return a.customerId===c.id&&a.type==='นัดติดตาม'&&!pd(a).done})
                  .sort(function(a,b){return ts(pd(a).due||a.at)-ts(pd(b).due||b.at)});
  var dueHtml=due.length?'<div class="due"><div class="ctitle" style="padding:0 0 4px;color:var(--amberink)">นัดติดตามที่ค้าง · '+due.length+' รายการ</div>'+
    due.map(function(a){var d=pd(a);return '<div class="it"><div style="min-width:0"><div class="t">'+esc(a.note)+'</div><div class="m">ถึงกำหนด '+fd(d.due)+' · '+esc(d.who||'ฉัน')+'</div></div><button class="done" onclick="doneAct(\''+esc(a.activityId)+'\')">เสร็จแล้ว</button></div>'}).join('')+'</div>':'';

  var events=[];
  DB.acts.forEach(function(a){if(a.customerId===c.id)events.push({at:a.at,type:a.type,note:a.note,pin:!!pd(a).pin})});
  billsOf(c.id).forEach(function(b){events.push({at:b.date,type:'บิล',note:'ออกบิล '+b.no+' · '+fm(b.total),pin:false})});
  events.sort(function(a,b){return (b.pin-a.pin)||(ts(b.at)-ts(a.at))});

  $('#p-act').innerHTML=
    '<div class="card"><div class="ctitle">บันทึกกิจกรรม</div>'+
    '<div class="types">'+TYPES.map(function(t){return '<button class="chip'+(t===DB.type?' on':'')+'" onclick="setType(\''+t+'\')">'+t+'</button>'}).join('')+'</div>'+
    '<textarea id="ntext" placeholder="เช่น ลูกค้าบอกสั่งเพิ่มเดือนหน้า ขอให้โทรก่อนมา">'+esc(DB.draft)+'</textarea>'+
    (DB.type==='นัดติดตาม'?'<div class="row2"><input type="date" id="due" value="'+new Date(Date.now()+864e5).toISOString().slice(0,10)+'"><input type="text" id="who" placeholder="ผู้รับผิดชอบ" value="ฉัน"></div>':'')+
    '<label class="chk"><input type="checkbox" id="pin" '+(DB.pin?'checked':'')+' onchange="DB.pin=this.checked"> ปักไว้บนสุด</label>'+
    '<div class="btns"><button class="btn" onclick="DB.draft=\'\';renderAct()">ล้าง</button><button class="btn pri" onclick="saveAct()">บันทึก</button></div></div>'+
    dueHtml+
    '<div class="card"><div class="ctitle">ไทม์ไลน์ <span class="sync">ล่าสุดก่อน</span></div>'+
    (events.length?'<div class="tl">'+events.map(function(e){return '<div class="ev"><div class="h"><span><span class="tag'+(e.type==='นัดติดตาม'?' g':'')+'">'+esc(e.type)+'</span></span>'+(e.pin?'<span class="tag">ปักไว้</span>':'')+'</div><div class="d">'+fd(e.at)+'</div><div class="x">'+esc(e.note||'')+'</div></div>'}).join('')+'</div>':'<div class="empty">ยังไม่มีกิจกรรม</div>')+'</div>';
}
function setType(t){
  var el=$('#ntext');if(el)DB.draft=el.value;
  DB.type=t;renderAct();
}
function saveAct(){
  var el=$('#ntext'),note=el?el.value.trim():'';
  if(!note){if(el)el.focus();return}
  var cid=DB.cur,now=new Date().toISOString();
  var id='A-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  var data={note:note,at:now,updatedAt:now,type:DB.type,cid:cid,id:id,activityId:id,customerId:cid,pin:DB.pin};
  if(DB.type==='นัดติดตาม'){data.due=$('#due').value;data.who=($('#who').value||'ฉัน');data.done=false}
  call({action:'append',sheet:'activities',rows:[[id,cid,DB.type,now,'','',note,'','',now,JSON.stringify(data)]]})
    .then(function(){DB.draft='';DB.pin=false;toast('บันทึกกิจกรรมแล้ว');return pull()})
    .then(function(){renderDetail()})
    .catch(function(e){toast('บันทึกไม่สำเร็จ: '+e.message)});
}
function doneAct(aid){
  var a=DB.acts.filter(function(x){return x.activityId===aid})[0];if(!a)return;
  var d=pd(a);d.done=true;
  var raw=a._raw.slice();raw[9]=new Date().toISOString();raw[10]=JSON.stringify(d);
  call({action:'update',range:'activities!A'+a._row+':K'+a._row,rows:[raw]})
    .then(function(){toast('ปิดนัดติดตามแล้ว');return pull()})
    .then(function(){renderDetail()})
    .catch(function(e){toast('บันทึกไม่สำเร็จ: '+e.message)});
}

/* ---------- ชีตย่อย ---------- */
function openSheet(kind){
  var c=cust(DB.cur);if(!c)return;
  var h='';
  if(kind==='call'){
    var phones=[c.phone].concat((c.contactExtra||'').match(/0\d{1,2}[- ]?\d{3}[- ]?\d{4}/g)||[]).filter(Boolean);
    var uniq=phones.filter(function(p,i){return phones.indexOf(p)===i});
    h='<h3>โทรหาร้าน</h3>'+(uniq.length?uniq.map(function(p){return '<a class="btn" href="tel:'+esc(p.replace(/[^0-9+]/g,''))+'" style="margin-bottom:8px">'+esc(p)+'</a>'}).join(''):'<div class="empty">ไม่มีเบอร์ในระบบ</div>');
  } else if(kind==='hist'){
    var bl=billsOf(c.id);
    h='<h3>ประวัติบิล</h3>'+(bl.length?bl.map(billCard).join(''):'<div class="empty">ยังไม่มีบิล</div>');
  } else if(kind==='edit'){
    var fld=function(k,label,multi){
      return '<label class="fld"><span>'+label+'</span>'+(multi?'<textarea id="f_'+k+'">'+esc(c[k])+'</textarea>':'<input id="f_'+k+'" value="'+esc(c[k])+'">')+'</label>';
    };
    var terms=['เงินสด','เงินเชื่อ','โอน'];
    if(c.paymentTerm&&terms.indexOf(c.paymentTerm)<0)terms.push(c.paymentTerm);
    h='<h3>แก้ไขข้อมูลลูกค้า</h3>'+
      '<div class="fg"><span style="color:var(--mute)">รหัสลูกค้า</span><b>'+esc(c.id)+'</b></div>'+
      fld('name','ชื่อร้าน')+fld('contactName','ผู้ติดต่อ')+fld('phone','เบอร์โทร')+fld('address','ที่อยู่ส่งสินค้า',true)+
      '<label class="fld"><span>เงื่อนไขชำระ</span><select id="f_paymentTerm">'+terms.map(function(o){return '<option'+(o===c.paymentTerm?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></label>'+
      fld('customerNote','หมายเหตุ',true)+
      '<div class="btnrow"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn pri" onclick="saveCust()">บันทึก</button></div>';
  }
  $('#sheetBody').innerHTML=h;
  $('#sheet').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on')}
function saveCust(){
  var c=cust(DB.cur);if(!c)return;
  var raw=c._raw.slice();
  ['name','contactName','phone','address','paymentTerm','customerNote'].forEach(function(k){
    var el=$('#f_'+k),idx=DB.custH.indexOf(k);
    if(el&&idx>=0)raw[idx]=el.value.trim();
  });
  call({action:'update',range:'customers!A'+c._row+':'+col(DB.custH.length)+c._row,rows:[raw]})
    .then(function(){closeSheet();toast('บันทึกแล้ว');return pull()})
    .then(function(){renderDetail()})
    .catch(function(e){toast('บันทึกไม่สำเร็จ: '+e.message)});
}
function copyBill(no){
  var b=billsOf(DB.cur).filter(function(x){return x.no===no})[0];if(!b)return;
  var c=cust(DB.cur);

/* ---------- หลังบ้าน: รายงานรายเดือน ---------- */
// รวมบิลให้เป็นหนึ่งแถวต่อบิล (แคชไว้ จนกว่าจะโหลดข้อมูลใหม่)
function billRows(){
  if(DB._br)return DB._br;
  var tot={};DB.items.forEach(function(it){tot[it.billNo]=(tot[it.billNo]||0)+(Number(it.amount)||0)});
  var seen={},out=[];
  DB.bills.forEach(function(b){if(seen[b.no])return;seen[b.no]=1;out.push({no:b.no,cid:b.customerId,d:String(b.date||'').slice(0,10),total:tot[b.no]||0})});
  return DB._br=out;
}
function ymOf(d){return String(d||'').slice(0,7)}
function addMonth(ym,k){var t=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+k,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')}
function ymLabel(ym){var t=new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1);return t.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}
function monShops(ym,maxDay){
  var sh={};
  billRows().forEach(function(b){if(ymOf(b.d)!==ym||(maxDay&&+b.d.slice(8,10)>maxDay))return;var o=sh[b.cid]=sh[b.cid]||{id:b.cid,v:0,n:0,last:''};o.v+=b.total;o.n++;if(b.d>o.last)o.last=b.d});
  return sh;
}
function salesOf(ym){return billRows().filter(function(b){return ymOf(b.d)===ym}).reduce(function(s,b){return s+b.total},0)}
function openBack(){show('back')}
function openMonth(ym){
  if(!DB.month){var last=billRows().map(function(b){return b.d}).sort().pop()||'';DB.month=ymOf(last)||new Date().toISOString().slice(0,7)}
  if(ym)DB.month=ym;
  show('month');renderMonth();
}
function renderMonth(){
  var ym=DB.month,pm=addMonth(ym,-1);
  $('#mTitle').textContent=ymLabel(ym);
  $('#mPrev').onclick=function(){DB.month=pm;renderMonth()};
  $('#mNext').onclick=function(){DB.month=addMonth(ym,1);renderMonth()};
  // เดือนที่ยังไม่จบ: เทียบเดือนก่อนเฉพาะถึงวันที่ล่าสุดของข้อมูล
  var lastD=billRows().map(function(b){return b.d}).sort().pop()||'';
  var partial=ym===ymOf(lastD)&&+lastD.slice(8,10)<new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
  var dn=partial?+lastD.slice(8,10):0;
  var cur=monShops(ym),prv=monShops(pm,dn);
  var SL=Object.keys(cur).map(function(k){return cur[k]}).sort(function(a,b){return b.v-a.v});
  var tot=SL.reduce(function(s,x){return s+x.v},0);
  var nBills=billRows().filter(function(b){return ymOf(b.d)===ym}).length;
  var reg=SL.filter(function(x){return prv[x.id]}).length;
  var drop=Object.keys(prv).map(function(k){return prv[k]}).filter(function(x){var c=cur[x.id];return (c?c.v:0)<x.v*0.5}).sort(function(a,b){return b.v-a.v});
  var six=[];for(var i=5;i>=0;i--){var k=addMonth(ym,-i);six.push({k:k,v:salesOf(k)})}
  var mx=Math.max.apply(null,six.map(function(x){return x.v}))||1;
  function shopRow(x,extra){var c=cust(x.id);return '<div class="crow" style="cursor:pointer" onclick="openCust(\''+esc(x.id)+'\')"><div style="min-width:0"><div class="cn">'+esc(c?c.name:x.id)+'</div><div class="cm">'+esc(extra)+'</div></div><b style="white-space:nowrap">'+fm(x.v)+'</b></div>'}
  $('#mBody').innerHTML=
    '<div class="stats"><div class="stat"><span class="k">ยอดขายเดือนนี้</span><b style="font-size:17px">'+fm(tot)+'</b><div class="meta">'+nBills+' บิล</div></div><div class="stat"><span class="k">ร้านที่ซื้อ</span><b style="font-size:17px">'+SL.length+'</b><div class="meta">ซื้อซ้ำจากเดือนก่อน '+reg+' ร้าน</div></div></div>'+
    '<div class="card"><div class="ctitle">ยอดขาย 6 เดือน</div>'+six.map(function(x){return '<div class="bar6"><span class="mo">'+esc(x.k.slice(5))+'</span><span class="track"><i style="width:'+Math.round(x.v/mx*100)+'%"></i></span><b>'+fm(x.v)+'</b></div>'}).join('')+'</div>'+
    '<div class="card"><div class="ctitle">ยอดลดลงเกิน 50% เทียบเดือนก่อน · '+drop.length+' ร้าน</div><div class="count">'+(partial?'เทียบช่วงวันที่ 1–'+dn+' ของเดือนก่อน':'เทียบกับเดือนก่อนทั้งเดือน')+'</div>'+(drop.length?drop.slice(0,50).map(function(x){return shopRow(x,'เดือนก่อน '+fm(x.v)+' · เดือนนี้ '+fm(cur[x.id]?cur[x.id].v:0))}).join(''):'<div class="empty">ไม่มี</div>')+'</div>'+
    '<div class="card"><div class="ctitle">ร้านที่ซื้อในเดือนนี้ · '+SL.length+' ร้าน</div>'+(SL.length?SL.slice(0,80).map(function(x){return shopRow(x,x.n+' บิล · ล่าสุด '+fd(x.last))}).join(''):'<div class="empty">ไม่มีบิลในเดือนนี้</div>')+'</div>';
}

    '<div class="card"><div class="ctitle">รายเดือน</div>'+rows.map(function(x){return '<div class="bar6"><span class="mo">'+(x.k.slice(5))+'</span><span class="track"><i style="width:'+Math.round(x.v/mx*100)+'%"></i></span><b>'+fm(x.v)+'</b></div>'}).join('')+'</div>';

// ค่าล่าสุดของชุดที่ขึ้นต้นด้วย prefix ในแท็บ systemSettings
// กติกาตัวเลขเก็บในเครื่อง (localStorage) ตามแอปเดิม; การเปลี่ยนแปลงลงประวัติในแท็บ changes
var RULES_DEF={near:90,due:100,over:150,comm:8};
function loadRules(){try{return Object.assign({},RULES_DEF,JSON.parse(localStorage.getItem('acrm.rules')||'{}'))}catch(e){return Object.assign({},RULES_DEF)}}
var RULE_FIELDS=[['near','ใกล้ถึงรอบ (%)'],['due','ถึงรอบ (%)'],['over','เลยรอบ (%)'],['comm','คอมมิชชั่น (%)']];
function rulesHtml(){
  var r=loadRules();
  return '<div class="card"><div class="ctitle">ค่าที่ใช้อยู่</div><div class="field">'+RULE_FIELDS.map(function(f){return '<div><label>'+f[1]+'</label><input id="r_'+f[0]+'" type="number" inputmode="decimal" value="'+esc(r[f[0]]==null?'':r[f[0]])+'"></div>'}).join('')+'</div>'+
    '<div class="err" id="r_err"></div>'+
    '<div class="btns"><button class="btn" onclick="openSub(\'hub\')">ยกเลิก</button><button class="btn pri" onclick="saveRules()">บันทึก</button></div></div>'+
    '<div class="count">รอบซื้อ = มัธยฐานช่วงห่างของวันที่ซื้อ (ต้องมีอย่างน้อย 3 วัน) · ต้องเรียง ใกล้ถึง &lt; ถึง &lt; เลยรอบ · คอมมิชชั่นอยู่ระหว่าง 0–100</div>';
}
function saveRules(){
  var n={};RULE_FIELDS.forEach(function(f){n[f[0]]=Number($('#r_'+f[0]).value)});
  var msg='';
  if(RULE_FIELDS.some(function(f){return $('#r_'+f[0]).value===''||isNaN(n[f[0]])}))msg='กรอกค่าให้ครบทุกช่อง';
  else if(!(n.near<n.due&&n.due<n.over))msg='ต้องเรียง ใกล้ถึง < ถึง < เลยรอบ';
  else if(!(n.comm>=0&&n.comm<=100))msg='คอมมิชชั่นต้องอยู่ระหว่าง 0–100';
  $('#r_err').textContent=msg;
  if(msg)return;
  var ts=new Date().toISOString(),opId='op-'+Date.now(),data=JSON.stringify(n);
  localStorage.setItem('acrm.rules',data);
  // บันทึกประวัติเหมือนแอปเดิม: entity=ตั้งค่า, action=ชื่อการตั้งค่า, after=ค่าใหม่
  call({action:'append',sheet:'changes',rows:[[ts,'ตั้งค่า','','กติกาตัวเลข','',data,opId,'web','']]})
    .then(function(){toast('บันทึกกติกาแล้ว');renderSub()})
    .catch(function(e){toast('บันทึกประวัติไม่สำเร็จ: '+e.message+' (ค่าถูกบันทึกในเครื่องแล้ว)');renderSub()});
}

// ผลโหลดที่มาช้าอาจมาถึงหลังผู้ใช้ออกจากหน้าแล้ว จึงเขียนเฉพาะเมื่อรายการยังอยู่บนจอ
function setIf(id,html){var el=$(id);if(el)el.innerHTML=html}
function loadAudit(){
  call({action:'get',range:'changes!A1:H'}).then(function(j){

    '<div class="card"><div class="ctitle">รูปที่บันทึกในเครื่องนี้ ('+mine.length+')</div>'+(mine.map(function(p){return '<div class="r"><span class="k">'+fd(p.at)+'</span><span class="v">'+(p.lat?p.lat.toFixed(5)+', '+p.lng.toFixed(5):'ไม่มีพิกัด')+'</span></div>'}).join('')||'<div class="empty">ยังไม่มี</div>')+'</div>';
}
function shrinkImg(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var m=1280,sc=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',0.8).split(',')[1])};img.onerror=function(){rej(new Error('อ่านรูปไม่ได้'))};img.src=u})}
function getPos(){return new Promise(function(res){if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)})},function(){res(null)},{enableHighAccuracy:true,timeout:8000,maximumAge:60000})})}
function xPhoto(input,cid){
  var f=input.files&&input.files[0];if(!f)return;
  var st=$('#x_pstat'),er=$('#x_perr');if(er)er.textContent='';if(st)st.textContent='กำลังบันทึกรูป…';
  var pid='P-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),at=nowIso(),pos=null,b64=null;
  Promise.all([shrinkImg(f),getPos()]).then(function(r){b64=r[0];pos=r[1];
    return call({action:'photo',base64:b64,mime:'image/jpeg',name:pid+'.jpg',folder:PHOTO_DIR});
  }).then(function(j){
    var lat=pos?pos.lat:'',lng=pos?pos.lng:'',acc=pos?pos.acc:'';
    return call({action:'append',sheet:'photos',rows:[[pid,cid,'',at,j.id,PHOTO_DIR,'visit','',lat,lng,'web',at,JSON.stringify({accuracy:acc,deviceId:'web'}),'OP-'+pid]]}).then(function(){return{lat:lat,lng:lng}});
  }).then(function(g){
    DB.xphotos.push({cid:cid,at:at,lat:g.lat===''?null:g.lat,lng:g.lng===''?null:g.lng});
    toast('บันทึกรูปแล้ว'+(g.lat===''?' (ไม่มีพิกัด)':''));
    renderX();
  }).catch(function(e){if(st)st.textContent='';if(er)er.textContent='บันทึกรูปไม่สำเร็จ: '+e.message});
}

/* ---------- เริ่มทำงาน ---------- */
$('#q').addEventListener('input',renderList);
$('#ic-users').innerHTML=ic('users',22);
$('#ic-gear').innerHTML=ic('gear',22);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
if(!DB.api){openSettings()}
else{pull().then(goList).catch(function(e){toast(e.message);goList()})}
</script>
