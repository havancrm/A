<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM ภาคสนาม</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e7ee;
          --brand:#1f4fb4; --ok:#1b8a4b; --warn:#b46a00; --bad:#b42323; --r:12px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8ebf1; --muted:#9aa3b5; --line:#2a3140; --brand:#6d94ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Sarabun","Noto Sans Thai",sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  nav { display:flex; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:4; }
  nav a { flex:1; text-align:center; padding:10px 4px; color:var(--muted); text-decoration:none; font-size:14px; }
  nav a.on { color:var(--brand); font-weight:600; border-bottom:2px solid var(--brand); }
  main { padding:12px 16px 80px; max-width:720px; margin:0 auto; }
  h2 { font-size:18px; margin:12px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:14px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--line); color:var(--text); margin-right:4px; }
  .tag.warn { background:#fff1d6; color:#7a4a00; } .tag.bad { background:#fde2e2; color:#8c1d1d; } .tag.ok { background:#dff5e7; color:#11633a; }
  @media (prefers-color-scheme: dark) { .tag.warn{background:#4a3a14;color:#ffd58a} .tag.bad{background:#4a1d1d;color:#ffb3b3} .tag.ok{background:#15382a;color:#9be3b8} }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:var(--card); color:var(--text); font-family:inherit; }
  textarea { min-height:70px; }
  label.f { display:block; color:var(--muted); font-size:14px; margin:10px 0 4px; }
  button, .btn { appearance:none; border:0; border-radius:10px; padding:11px 16px; font-size:16px; background:var(--brand); color:#fff; text-decoration:none; display:inline-block; cursor:pointer; font-family:inherit; text-align:center; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost, .btn.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button.danger { background:var(--bad); }
  button.small, .btn.small { padding:6px 10px; font-size:14px; }
  .list a.item, .item { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-bottom:8px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; }
  .chip { white-space:nowrap; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:14px; cursor:pointer; }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .empty { text-align:center; color:var(--muted); padding:24px 0; }
  .kv { display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding:6px 0; }
  .kv > span:last-child { text-align:right; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; z-index:20; }
  #print { display:none; }
  @media print {
    header, nav, main, .toast { display:none !important; }
    #print { display:block; color:#000; background:#fff; padding:12mm; font-size:12pt; }
    #print table td, #print table th { border-bottom:1px solid #000; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">CRM ภาคสนาม</h1>
  <span id="whoami" style="color:#dfe7ff;font-size:13px"></span>
</header>
<nav>
  <a href="#/" data-nav="list">ลูกค้า</a>
  <a href="#/tasks" data-nav="tasks">งานติดตาม</a>
  <a href="#/settings" data-nav="settings">ตั้งค่า</a>
</nav>
<main id="app"></main>
<div id="print"></div>
<div class="toast" id="toast"></div>
<script src="data/data.js"></script>
<script>
(function () {
  "use strict";

  // ---------- helpers ----------
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var money = function (n) { return Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var isoDay = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var todayStr = function () { return isoDay(new Date()); };
  var addDays = function (iso, n) { var d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoDay(d); };
  var daysBetween = function (a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); };
  var uid = function (p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var toast = function (msg) {
    var t = $("#toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 1800);
  };
  var enc = encodeURIComponent;

  // ---------- local storage (per browser; never throws) ----------
  var KEY = "crm.prototype.state";
  var emptyState = function () { return { customers: {}, visits: [], tasks: [], orders: [], settings: { defaultCycle: 30, user: "" } }; };
  var state;
  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!s) return emptyState();
      s.customers = s.customers || {}; s.visits = s.visits || []; s.tasks = s.tasks || []; s.orders = s.orders || [];
      s.settings = Object.assign({ defaultCycle: 30, user: "" }, s.settings || {});
      return s;
    } catch (e) { return emptyState(); }
  }
  function saveState() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast("บันทึกในเครื่องไม่ได้ ข้อมูลอาจหายเมื่อปิดหน้า"); }
  }

  // ---------- data (built from the Sheet by tools/build_data.py) ----------
  var DATA = window.CRM_DATA || { customers: [], bills: [], products: [] };
  var CUST = {}; DATA.customers.forEach(function (c) { CUST[c.id] = c; });
  var BILLS_BY_CUST = {};
  DATA.bills.forEach(function (b) { (BILLS_BY_CUST[b.customerId] = BILLS_BY_CUST[b.customerId] || []).push(b); });
  Object.keys(BILLS_BY_CUST).forEach(function (k) { BILLS_BY_CUST[k].reverse(); }); // newest first
  var PAY_OPTIONS = ["เงินสด", "โอน", "เครดิต 15 วัน", "เครดิต 20 วัน", "เครดิต 30 วัน", "รับเช็ค 30 วัน"];
  var VISIT_OUTCOMES = ["สั่งแล้ว", "ไม่สั่ง (สินค้ายังเหลือ)", "ติดตามต่อ", "ไม่พบเจ้าของร้าน", "ร้านปิด", "อื่นๆ"];
  // Text fields the app lets users edit. Anything not listed stays read-only from the Sheet.
  var TEXT_FIELDS = [
    ["name", "ชื่อลูกค้า / ร้าน"], ["type", "ประเภท"], ["address", "ที่อยู่"], ["phone", "เบอร์โทร"],
    ["contactName", "ชื่อผู้ติดต่อ"], ["owner", "ผู้ดูแล (เซลล์)"], ["billClerk", "ผู้ออกบิลเดิม"],
    ["lineId", "LINE ID"], ["email", "อีเมล"], ["storeHours", "เวลาทำการ"],
    ["specialConditions", "เงื่อนไขพิเศษ"], ["customerNote", "หมายเหตุลูกค้า"], ["keepNote", "หมายเหตุภายใน"],
    ["taxName", "ชื่อในใบกำกับภาษี"], ["taxAddress", "ที่อยู่ใบกำกับภาษี"], ["taxBranch", "สาขา"], ["taxId", "เลขผู้เสียภาษี"],
    ["taxInvoiceRequired", "ต้องการใบกำกับภาษี"], ["receiptRequired", "ต้องการใบเสร็จ"]
  ];

  // Merged view: sheet data + this device's edits (only changed fields are stored as edits).
  function customer(id) {
    var base = CUST[id]; if (!base) return null;
    return Object.assign({}, base, state.customers[id] || {});
  }
  function visitDay(v) { return v.day || v.at.slice(0, 10); }
  function lastVisit(id) {
    var v = state.visits.filter(function (x) { return x.cid === id; });
    v.sort(function (a, b) { return visitDay(a) < visitDay(b) ? 1 : -1; });
    return v[0] || null;
  }
  function cycleOf(c) { return c.visitCycleDays || state.settings.defaultCycle; }
  function dueStatus(c) {
    var lv = lastVisit(c.id);
    var base = lv ? visitDay(lv) : c.lastBillDate;
    if (!base) return { due: false, nextDate: null };
    var nextDate = addDays(base, cycleOf(c));
    return { due: nextDate <= todayStr(), nextDate: nextDate };
  }

  // ---------- routing ----------
  function route() {
    var parts = (location.hash.replace(/^#/, "") || "/").split("/").filter(Boolean).map(function (p) { return decodeURIComponent(p); });
    var nav = parts[0] === "tasks" ? "tasks" : parts[0] === "settings" ? "settings" : "list";
    document.querySelectorAll("nav a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === nav); });
    var k = parts[0], id = parts[1];
    if (!k) return viewList();
    if (k === "c" && id) return viewCustomer(id);
    if (k === "edit" && id === "c" && parts[2]) return viewEditCustomer(parts[2]);
    if (k === "visit" && id) return viewVisit(id, parts[2] || null);
    if (k === "order" && id) return viewOrder(id, parts[2] || null);
    if (k === "bill" && id) return viewBill(id);
    if (k === "task" && id) return viewTask(id);
    if (k === "tasks") return viewTasks();
    if (k === "settings") return viewSettings();
    viewList();
  }
  function setTitle(t) { $("#title").textContent = t; document.title = t + " · CRM"; }
  function app(html) { $("#app").innerHTML = html; window.scrollTo(0, 0); }
  function notFound(what) { setTitle("ไม่พบข้อมูล"); app('<div class="empty">ไม่พบ' + esc(what) + '</div><a class="btn ghost" href="#/">กลับหน้าลูกค้า</a>'); }

  // ---------- customer list ----------
  var listFilter = "all", listQuery = "";
  function viewList() {
    setTitle("ลูกค้า");
    var filters = [["all", "ทั้งหมด"], ["due", "ถึงรอบเยี่ยม"], ["noOwner", "ยังไม่มีเจ้าของ"], ["lapsed", "ไม่ซื้อ > 90 วัน"], ["noGps", "ไม่มีพิกัด"]];
    app(
      '<input id="q" placeholder="ค้นหาชื่อ / เบอร์ / ทำเล / รหัส" value="' + esc(listQuery) + '" style="margin-bottom:8px">' +
      '<div class="chips">' + filters.map(function (f) {
        return '<button class="chip' + (listFilter === f[0] ? " on" : "") + '" data-f="' + f[0] + '">' + f[1] + "</button>";
      }).join("") + "</div>" +
      '<div id="count" class="muted" style="margin-bottom:6px"></div><div id="items"></div>'
    );
    $("#q").addEventListener("input", function (e) { listQuery = e.target.value; renderItems(); });
    document.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () { listFilter = b.getAttribute("data-f"); viewList(); });
    });
    renderItems();
  }
  function renderItems() {
    var q = listQuery.trim().toLowerCase();
    var all = DATA.customers.map(function (base) { return customer(base.id); }).filter(function (c) {
      if (listFilter === "due" && !dueStatus(c).due) return false;
      if (listFilter === "noOwner" && c.owner) return false;
      if (listFilter === "noGps" && c.lat != null) return false;
      if (listFilter === "lapsed" && !(c.daysSinceLastBill != null && c.daysSinceLastBill > 90)) return false;
      if (!q) return true;
      return (c.name + " " + c.address + " " + c.phone + " " + c.id + " " + c.contactName).toLowerCase().indexOf(q) >= 0;
    });
    $("#count").textContent = "พบ " + all.length + " ราย" + (all.length > 100 ? " (แสดง 100 แรก พิมพ์ค้นหาเพื่อแคบลง)" : "");
    $("#items").innerHTML = all.slice(0, 100).map(function (c) {
      var ds = dueStatus(c), tags = [];
      if (ds.due) tags.push('<span class="tag warn">ถึงรอบ</span>');
      if (!c.owner) tags.push('<span class="tag bad">ไม่มีเจ้าของ</span>');
      if (c.lat == null) tags.push('<span class="tag">ไม่มีพิกัด</span>');
      var last = c.daysSinceLastBill == null ? "ยังไม่มีบิล" : "ซื้อล่าสุด " + c.daysSinceLastBill + " วันก่อน";
      return '<a class="item" href="#/c/' + enc(c.id) + '"><div><b>' + esc(c.name) + "</b></div>" +
        '<div class="muted">' + esc(c.type) + " · " + esc(c.id) + " · " + last + '</div>' +
        '<div style="margin-top:4px">' + tags.join("") + "</div></a>";
    }).join("") || '<div class="empty">ไม่พบลูกค้า</div>';
  }

  // ---------- customer detail ----------
  function kv(label, value) {
    return '<div class="kv"><span class="muted">' + esc(label) + "</span><span>" +
      (value ? esc(value) : '<span class="tag warn">ยังไม่มีข้อมูล</span>') + "</span></div>";
  }
  function viewCustomer(id) {
    var c = customer(id); if (!c) return notFound("ลูกค้ารหัส " + id);
    setTitle(c.name.length > 26 ? c.name.slice(0, 26) + "…" : c.name);
    var ds = dueStatus(c);
    var bills = (BILLS_BY_CUST[id] || []).slice(0, 10);
    var visits = state.visits.filter(function (v) { return v.cid === id; }).sort(function (a, b) { return visitDay(a) < visitDay(b) ? 1 : -1; }).slice(0, 8);
    var orders = state.orders.filter(function (o) { return o.cid === id; });
    var tasks = state.tasks.filter(function (t) { return t.cid === id && !t.done; });
    var mapHref = c.lat != null
      ? "https://www.google.com/maps/search/?api=1&query=" + c.lat + "," + c.lng
      : "https://www.google.com/maps/search/?api=1&query=" + enc(c.address || c.name);
    app(
      '<div class="card">' +
        '<div style="font-size:18px;font-weight:600">' + esc(c.name) + "</div>" +
        '<div class="muted">' + esc(c.type) + " · รหัส " + esc(c.id) + "</div>" +
        '<div style="margin-top:8px">' +
          (ds.due ? '<span class="tag warn">ถึงรอบเยี่ยมแล้ว</span>' : ds.nextDate ? '<span class="tag ok">เยี่ยมครั้งถัดไป ' + ds.nextDate + "</span>" : "") +
          (!c.owner ? '<span class="tag bad">ยังไม่มีเจ้าของ</span>' : "") +
          (c.lat == null ? '<span class="tag">ไม่มีพิกัด</span>' : "") +
        "</div>" +
      "</div>" +
      '<div class="actions">' +
        '<a class="btn" href="#/visit/' + enc(id) + '">บันทึกการเยี่ยม</a>' +
        '<a class="btn" href="#/order/' + enc(id) + '">สั่งของ / ออกใบ</a>' +
        (c.phone ? '<a class="btn ghost" href="tel:' + esc(c.phone.replace(/[^0-9+]/g, "")) + '">โทร ' + esc(c.phone) + "</a>" : '<button class="ghost" disabled>ไม่มีเบอร์</button>') +
        '<a class="btn ghost" target="_blank" rel="noopener" href="' + mapHref + '">นำทาง</a>' +
        '<a class="btn ghost" href="#/edit/c/' + enc(id) + '" style="grid-column:1/-1">แก้ไขข้อมูลลูกค้า</a>' +
      "</div>" +
      '<div class="card"><h2 style="margin-top:0">ข้อมูล</h2>' +
        kv("ที่อยู่", c.address) + kv("ผู้ติดต่อ", c.contactName) + kv("เบอร์โทร", c.phone) +
        kv("ผู้ดูแล (เซลล์)", c.owner) + kv("รอบเยี่ยม (วัน)", c.visitCycleDays ? String(c.visitCycleDays) : "") +
        kv("พิกัด GPS", c.lat != null ? c.lat.toFixed(5) + ", " + c.lng.toFixed(5) : "") +
        kv("เงื่อนไขชำระ", c.paymentTerm) + kv("สถานะ", c.activeFlag === "FALSE" ? "ไม่ใช้งาน" : "ใช้งาน") +
        (c.specialConditions ? kv("เงื่อนไขพิเศษ", c.specialConditions) : "") +
        (c.customerNote ? kv("หมายเหตุลูกค้า", c.customerNote) : "") +
      "</div>" +
      '<div class="card"><h2 style="margin-top:0">สรุปการซื้อ</h2>' +
        '<div class="muted">บิลจากระบบ ' + c.billCount + " ใบ · ยอดขายรวม " + money(c.totalSales) + " บาท" +
        (c.daysSinceLastBill != null ? " · ซื้อล่าสุด " + c.lastBillDate + " (" + c.daysSinceLastBill + " วันก่อน)" : "") + "</div></div>" +
      '<div class="card"><h2 style="margin-top:0">ร่างบิลในเครื่องนี้</h2>' +
        (orders.length ? orders.map(function (o) {
          return '<div class="kv"><span>' + esc(o.date) + " · " + o.lines.length + " รายการ · " + money(o.total) + ' บาท</span>' +
            '<span><a class="btn ghost small" href="#/order/' + enc(id) + "/" + enc(o.id) + '">แก้</a> ' +
            '<button class="danger small" data-del-order="' + esc(o.id) + '">ลบ</button></span></div>';
        }).join("") : '<div class="muted">ยังไม่มีร่าง</div>') +
      "</div>" +
      '<div class="card"><h2 style="margin-top:0">บิลล่าสุด 10 ใบ (จากระบบ, อ่านอย่างเดียว)</h2>' +
        (bills.length ? '<table><tr><th>วันที่</th><th>เลขที่</th><th>ประเภท</th><th class="num">ยอด</th></tr>' +
          bills.map(function (b) {
            return '<tr><td>' + esc(b.date) + '</td><td><a href="#/bill/' + enc(b.no) + '">' + esc(b.no) + "</a></td><td>" + esc(b.type) + '</td><td class="num">' + money(b.total) + "</td></tr>";
          }).join("") + "</table>" : '<div class="muted">ยังไม่มีบิล</div>') +
      "</div>" +
      '<div class="card"><h2 style="margin-top:0">การเยี่ยม</h2>' +
        (visits.length ? visits.map(function (v) {
          return '<div class="kv" style="align-items:flex-start"><span><b>' + esc(visitDay(v)) + "</b> · " + esc(v.outcome) +
            (v.note ? '<div class="muted">' + esc(v.note) + "</div>" : "") + "</span>" +
            '<a class="btn ghost small" href="#/visit/' + enc(id) + "/" + enc(v.id) + '">แก้</a></div>';
        }).join("") : '<div class="muted">ยังไม่มีบันทึกการเยี่ยมในเครื่องนี้</div>') +
      "</div>" +
      '<div class="card"><h2 style="margin-top:0">งานติดตามที่ค้าง</h2>' +
        (tasks.length ? tasks.map(function (t) {
          return '<div class="kv"><span>' + esc(t.due) + " · " + esc(t.title) + '</span><a class="btn ghost small" href="#/task/' + enc(t.id) + '">แก้</a></div>';
        }).join("") : '<div class="muted">ไม่มีงานค้าง</div>') +
      "</div>"
    );
    document.querySelectorAll("[data-del-order]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm("ลบร่างบิลนี้ ?")) return;
        var oid = b.getAttribute("data-del-order");
        state.orders = state.orders.filter(function (o) { return o.id !== oid; });
        saveState(); toast("ลบร่างแล้ว"); viewCustomer(id);
      });
    });
  }

  // ---------- edit customer (all editable fields) ----------
  function viewEditCustomer(id) {
    var base = CUST[id]; if (!base) return notFound("ลูกค้ารหัส " + id);
    var c = customer(id);
    setTitle("แก้ไขข้อมูลลูกค้า");
    var payOpts = PAY_OPTIONS.slice(); if (c.paymentTerm && payOpts.indexOf(c.paymentTerm) < 0) payOpts.unshift(c.paymentTerm);
    app(
      '<div class="card"><div class="muted">รหัส ' + esc(id) + " · แก้แล้วจะถูกเก็บในเครื่องนี้ ช่องที่ไม่แก้ยังตามข้อมูลจากชีต</div></div>" +
      '<div class="card">' +
        TEXT_FIELDS.map(function (f) {

        '<input data-k="visitCycleDays" type="number" min="1" value="' + (c.visitCycleDays || "") + '">' +

      "</div>" +
      '<div class="actions"><button id="save">บันทึก</button><a class="btn ghost" href="#/c/' + enc(id) + '">ยกเลิก</a></div>' +

    );
    $("#gps").addEventListener("click", function () {
      if (!navigator.geolocation) return toast("เครื่องนี้ไม่รองรับ GPS");
      navigator.geolocation.getCurrentPosition(function (pos) {
        document.querySelector('[data-k="lat"]').value = pos.coords.latitude.toFixed(6);
        document.querySelector('[data-k="lng"]').value = pos.coords.longitude.toFixed(6);
        toast("ได้พิกัดแล้ว กดบันทึกเพื่อเก็บ");
      }, function () { toast("ไม่ได้รับสิทธิ์ตำแหน่ง"); });
    });
    $("#save").addEventListener("click", function () {
      var edits = {}, error = null;
      document.querySelectorAll("[data-k]").forEach(function (el) {
        if (error) return;
        var k = el.getAttribute("data-k"), raw = el.value.trim(), val;
        if (k === "lat" || k === "lng") {
          val = raw === "" ? null : parseFloat(raw);
          if (val !== null && isNaN(val)) { error = (k === "lat" ? "ละติจูด" : "ลองจิจูด") + "ไม่ถูกต้อง"; return; }
        } else if (k === "visitCycleDays") {
          val = raw === "" ? null : Math.max(1, parseInt(raw, 10) || 0) || null;
        } else {
          val = raw;
        }
        var baseVal = (k === "lat" || k === "lng" || k === "visitCycleDays")
          ? (base[k] == null ? null : base[k])
          : String(base[k] == null ? "" : base[k]);
        if (val !== baseVal) edits[k] = val;
      });
      if (error) return toast(error);
      if (Object.keys(edits).length) state.customers[id] = edits; else delete state.customers[id];
      saveState(); toast("บันทึกแล้ว"); go("/c/" + enc(id));
    });
    $("#revert").addEventListener("click", function () {
      if (!confirm("คืนค่าทุกช่องของลูกค้านี้เป็นข้อมูลเดิมจากชีต ?")) return;
      delete state.customers[id]; saveState(); toast("คืนค่าแล้ว"); go("/c/" + enc(id));
    });
  }

  // ---------- order / delivery note (create / edit draft) ----------
  var cart = {}; // cid -> { lines: [] } ; in-progress draft per customer
  var prodQuery = "";
  function orderTotal(lines) { return lines.reduce(function (s, l) { return s + l.qty * l.price; }, 0); }
  function viewOrder(cid, oid) {
    var c = customer(cid); if (!c) return notFound("ลูกค้า");
    var editing = oid ? state.orders.filter(function (o) { return o.id === oid; })[0] : null;
    if (editing) cart[cid] = { lines: editing.lines.map(function (l) { return Object.assign({}, l); }) };
    else cart[cid] = cart[cid] || { lines: [] };
    setTitle(editing ? "แก้ไขร่างบิล" : "สั่งของ");
    app(
      '<div class="card"><b>' + esc(c.name) + '</b><div class="muted">เงื่อนไข: ' + esc(c.paymentTerm || "เงินสด (ค่าเริ่มต้น)") + "</div></div>" +
      '<input id="pq" placeholder="ค้นหาสินค้า รหัส หรือชื่อ" value="' + esc(prodQuery) + '" style="margin-bottom:8px">' +
      '<div id="pres" style="max-height:260px;overflow:auto"></div>' +
      '<h2>รายการ</h2><div id="cart"></div>' +
      '<div class="actions"><button id="saveOrder">' + (editing ? "บันทึกการแก้ไขร่าง" : "บันทึกเป็นร่าง") + '</button><button class="ghost" id="printBtn">พิมพ์ใบส่งสินค้า</button></div>'
    );
    $("#pq").addEventListener("input", function (e) { prodQuery = e.target.value; renderProducts(cid); });
    renderProducts(cid); renderCart(cid);
    $("#saveOrder").addEventListener("click", function () {
      var lines = cart[cid].lines; if (!lines.length) return toast("ยังไม่มีรายการสินค้า");
      if (editing) {
        editing.lines = lines; editing.total = orderTotal(lines);
      } else {
        state.orders.push({ id: uid("o"), cid: cid, date: todayStr(), lines: lines, total: orderTotal(lines), status: "ร่าง" });
      }
      cart[cid] = { lines: [] }; saveState(); toast("บันทึกร่างแล้ว"); go("/c/" + enc(cid));
    });
    $("#printBtn").addEventListener("click", function () {
      var lines = cart[cid].lines; if (!lines.length) return toast("ยังไม่มีรายการสินค้า");
      printDeliveryNote(c, lines);
    });
  }
  function renderProducts(cid) {
    var q = prodQuery.trim().toLowerCase();
    var list = DATA.products.filter(function (p) { return !q || (p.code + " " + p.name).toLowerCase().indexOf(q) >= 0; }).slice(0, 25);
    $("#pres").innerHTML = list.length ? list.map(function (p) {
      return '<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin-bottom:6px">' +
        '<div><div>' + esc(p.name) + '</div><div class="muted">' + esc(p.code) + " · ราคาล่าสุด " + money(p.lastPrice) + "</div></div>" +
        '<button class="small" data-add="' + esc(p.code) + '">+ เพิ่ม</button></div>';
    }).join("") : '<div class="empty">ไม่พบสินค้า</div>';
    document.querySelectorAll("[data-add]").forEach(function (b) {
      b.addEventListener("click", function () {
        var code = b.getAttribute("data-add");
        var p = DATA.products.filter(function (x) { return x.code === code; })[0];
        var line = cart[cid].lines.filter(function (l) { return l.code === code; })[0];
        if (line) line.qty += 1; else cart[cid].lines.push({ code: p.code, name: p.name, qty: 1, price: p.lastPrice });
        renderCart(cid);
      });
    });
  }
  function renderCart(cid) {
    var lines = cart[cid].lines;
    if (!lines.length) { $("#cart").innerHTML = '<div class="empty">ยังไม่มีรายการ เลือกสินค้าจากด้านบน</div>'; return; }
    $("#cart").innerHTML = '<table><tr><th>สินค้า</th><th class="num">จำนวน</th><th class="num">ราคา</th><th class="num">รวม</th><th></th></tr>' +
      lines.map(function (l, i) {
        return "<tr><td>" + esc(l.name) + '<div class="muted">' + esc(l.code) + '</div></td>' +
          '<td class="num"><input type="number" min="0" value="' + l.qty + '" data-q="' + i + '" style="width:72px;padding:6px;text-align:right"></td>' +
          '<td class="num"><input type="number" min="0" value="' + l.price + '" data-p="' + i + '" style="width:84px;padding:6px;text-align:right"></td>' +
          '<td class="num">' + money(l.qty * l.price) + '</td><td><button class="danger small" data-del="' + i + '">ลบ</button></td></tr>';
      }).join("") +
      '<tr><td colspan="3" class="num"><b>รวมทั้งสิ้น</b></td><td class="num"><b>' + money(orderTotal(lines)) + "</b></td><td></td></tr></table>";
    document.querySelectorAll("[data-q]").forEach(function (el) {
      el.addEventListener("change", function () { lines[+el.getAttribute("data-q")].qty = Math.max(0, +el.value || 0); renderCart(cid); });
    });
    document.querySelectorAll("[data-p]").forEach(function (el) {
      el.addEventListener("change", function () { lines[+el.getAttribute("data-p")].price = Math.max(0, +el.value || 0); renderCart(cid); });
    });
    document.querySelectorAll("[data-del]").forEach(function (el) {
      el.addEventListener("click", function () { lines.splice(+el.getAttribute("data-del"), 1); renderCart(cid); });
    });
  }

      if (!confirm("ล้างการเยี่ยม งาน ร่างบิล และการแก้ไขลูกค้าทั้งหมดในเครื่องนี้ ?")) return;
      state = emptyState(); saveState(); whoami(); toast("ล้างแล้ว"); viewSettings();
    });
  }

  function whoami() { $("#whoami").textContent = state.settings.user ? "ผู้ใช้: " + state.settings.user : ""; }

  // ---------- boot ----------
  state = loadState();
  whoami();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
